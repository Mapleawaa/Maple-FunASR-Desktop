[project]
name = "maple-funasr-desktop"
version = "1.0.0"
description = "FunASR Windows 桌面端语音转写工具，支持说话人分离"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"

dependencies = [
    "PyQt6>=6.5",
    "PyQt6-Fluent-Widgets>=1.5",
    "funasr>=1.3",
    "torch>=2.0",
    "torchaudio>=2.0",
    "requests",
    "psutil>=5.9",
    # Windows 下读取 CPU/GPU 温度、功耗等传感器（LibreHardwareMonitorLib 绑定）
    "HardwareMonitor>=1.2; sys_platform == 'win32'",
    # WSLg 不可用时的备用 Web 控制台
    "Flask>=3.0",
]

[project.optional-dependencies]
# Intel XPU 现在由 PyTorch 官方 xpu 轮子直接支持，不再需要 intel-extension-for-pytorch：
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/xpu
xpu = []
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*", "ui*"]

[tool.setuptools.package-data]
"ui.resources" = ["*.exe", "*.ico", "LICENSE.ffmpeg"]
"app.web_console" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pyinstaller]
python_path = "."
console = false
name = "FunASR-Desktop"
hiddenimports = [
    "funasr",
    "funasr.models",
    "funasr.auto.auto_model",
    "qfluentwidgets",
    "PyQt6.QtCore",
    "PyQt6.QtGui",
    "PyQt6.QtWidgets",
    "torch",
    "torchaudio",
]

[dependency-groups]
build = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]
