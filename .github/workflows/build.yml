name: Build & Test

on:
  push:
    # 主干 + 常见修复/功能分支都跑 CI，便利用户在分支上就看到结果
    branches: [main, "fix/**", "feat/**", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ── 语法 / 导入检查（不装 torch，几十秒跑完）────────────────────────────
  lint:
    name: Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装轻量依赖（不含 torch / funasr）
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install PyQt6 psutil flask requests

      - name: Qt 运行库（headless 下导入 PyQt6 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: 语法编译
        run: uv run --no-sync python -m compileall -q app core ui tests main.py

      - name: 模块导入
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          sys.path.insert(0, '.')

          # 无界面 / 核心模块
          from app.settings import Settings
          from app.utils import find_ffmpeg
          from app.runtime_env import detect_runtime, choose_gui_platform
          from app.web_console.server import create_app
          from core.downloader import MODEL_BUNDLES, bundle_status
          from core.hardware_checker import detect_all, estimate_speeds, pick_best_device
          from core.hardware_monitor import HardwareMonitorSampler
          from core.pipeline import run_pipeline
          from core.torch_env import get_torch_env
          from core.exporter import export_result

          # GUI 模块（headless 只导入，不创建窗口）
          import ui.tabs.transcribe_tab
          import ui.tabs.hardware_tab
          import ui.tabs.models_tab
          import ui.widgets.monitor_panel
          import app.main_window

          assert "sensevoice" in MODEL_BUNDLES
          print("All modules import OK")
          PY

  # ── WSL2 兼容性（模拟无 WSLg 的 WSL2）─────────────────────────────────
  wsl2-compat:
    name: WSL2 Compatibility (no WSLg)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      WSL_DISTRO_NAME: Ubuntu
      # 故意不设置 DISPLAY / WAYLAND_DISPLAY，模拟没有 WSLg 的 WSL2

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装轻量依赖（Web 控制台不需要 Qt / torch）
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install psutil flask requests

      - name: 无显示环境冒烟测试
        run: uv run --no-sync python tests/test_smoke.py

  # ── Windows 构建 ─────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (PyInstaller)
    runs-on: windows-latest
    needs: [lint, wsl2-compat]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group build

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ui/resources/ffmpeg.exe
          key: ffmpeg-7.1

      - name: Download ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg" -Force
          $exe = (Get-ChildItem "$env:TEMP\ffmpeg\ffmpeg-*\bin\ffmpeg.exe").FullName
          New-Item -ItemType Directory -Path "ui/resources" -Force | Out-Null
          Copy-Item $exe "ui/resources/ffmpeg.exe" -Force
          Remove-Item $zip -Force
          Remove-Item "$env:TEMP\ffmpeg" -Recurse -Force

      - name: Download ffmpeg license
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/LICENSE.md" -OutFile "ui/resources/LICENSE.ffmpeg"

      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maple-FunASR-Desktop-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ── Linux / WSL2 构建（CPU 版 PyTorch，控制体积）─────────────────────
  build-linux:
    name: Build Linux / WSL2 (PyInstaller)
    runs-on: ubuntu-latest
    needs: [lint, wsl2-compat]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖（先跳过 torch，避免下载 CUDA 轮子）
        run: |
          uv sync --group build --no-install-project \
            --no-install-package torch --no-install-package torchaudio

      - name: 安装 CPU 版 PyTorch
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
            torch torchaudio

      - name: 安装 ffmpeg（便于在 WSL2 / Linux 直接处理视频）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p ui/resources
          cp "$(command -v ffmpeg)" ui/resources/ffmpeg

      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller build.spec

      - name: 基本可执行性检查
        run: |
          ./dist/Maple-FunASR-Desktop --help >/dev/null 2>&1 || true
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maple-FunASR-Desktop-Linux
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ── Release（tag 触发）──────────────────────────────────────────────
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Maple-FunASR-Desktop-Windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Maple-FunASR-Desktop-Linux
          path: artifacts/linux

      - name: Package archives
        run: |
          cd artifacts/windows
          zip -r "$GITHUB_WORKSPACE/Maple-FunASR-Desktop-${GITHUB_REF_NAME}-windows-x64.zip" .
          cd "$GITHUB_WORKSPACE"
          tar -czf "Maple-FunASR-Desktop-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C artifacts/linux .
          ls -lh *.zip *.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Maple-FunASR-Desktop-${{ github.ref_name }}-windows-x64.zip
            Maple-FunASR-Desktop-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
